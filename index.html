<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHOP CURTAIN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f1f4f8;
    }

    main {
      max-width: 460px;
      margin: 25px auto;
      padding: 25px 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 30px;
      margin: 5px 0 20px;
      color: #171717;
    }

    #status {
      min-height: 22px;
      margin-bottom: 18px;
      font-size: 14px;
      color: #555;
      overflow-wrap: anywhere;
    }

    button {
      display: block;
      width: 100%;
      padding: 23px 15px;
      margin: 14px 0;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .open {
      background: #16803c;
    }

    .stop {
      background: #bd2525;
    }

    .close {
      background: #2457c5;
    }

    #pinButton {
      margin-top: 20px;
      padding: 12px;
      font-size: 15px;
      color: #333;
      background: #e8edf4;
    }

    .note {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main>
    <h1>SHOP CURTAIN</h1>

    <p id="status" role="status" aria-live="polite">
      Enter your PIN to begin.
    </p>

    <button class="open" data-command="open">OPEN</button>
    <button class="stop" data-command="stop">STOP</button>
    <button class="close" data-command="close">CLOSE</button>

    <button id="pinButton">Change PIN</button>

    <p class="note">
      Use STOP to stop movement. Always supervise the curtain.
    </p>
  </main>

  <script>
    // Your Cloudflare Worker URL
    const WORKER_URL =
      "https://shop-curtain-backend.shari2018.workers.dev/";

    const statusBox = document.getElementById("status");
    const commandButtons =
      [...document.querySelectorAll("[data-command]")];
    const pinButton = document.getElementById("pinButton");

    let pin = sessionStorage.getItem("shopCurtainPin") || "";

    function setButtonsDisabled(disabled) {
      commandButtons.forEach(button => {
        button.disabled = disabled;
      });
    }

    function askForPin() {
      const entered = prompt("Enter your 4-digit SHOP CURTAIN PIN:");

      if (entered === null) {
        statusBox.textContent = "PIN required to send commands.";
        return false;
      }

      if (!/^\d{4}$/.test(entered.trim())) {
        statusBox.textContent = "PIN must contain exactly 4 digits.";
        return false;
      }

      pin = entered.trim();
      sessionStorage.setItem("shopCurtainPin", pin);
      statusBox.textContent = "PIN entered. Ready to send commands.";
      return true;
    }

    async function sendCommand(command) {
      if (!pin && !askForPin()) return;

      setButtonsDisabled(true);
      statusBox.textContent = "Sending " + command.toUpperCase() + "...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            pin: pin,
            command: command
          })
        });

        const result = await response.json().catch(() => ({}));

        if (response.ok && result.success === true) {
          statusBox.textContent =
            command.toUpperCase() + " command sent successfully.";
        } else if (response.status === 401) {
          sessionStorage.removeItem("shopCurtainPin");
          pin = "";
          statusBox.textContent = "Incorrect PIN. Please try again.";
        } else {
          statusBox.textContent =
            result.message || ("Request failed: HTTP " + response.status);
        }
      } catch (error) {
        statusBox.textContent =
          "Connection error. Check internet and Worker settings.";
        console.error("SHOP CURTAIN request failed:", error);
      } finally {
        setButtonsDisabled(false);
      }
    }

    commandButtons.forEach(button => {
      button.addEventListener("click", () => {
        sendCommand(button.dataset.command);
      });
    });

    pinButton.addEventListener("click", () => {
      sessionStorage.removeItem("shopCurtainPin");
      pin = "";
      askForPin();
    });

    setButtonsDisabled(false);
  </script>
</body>
</html>
