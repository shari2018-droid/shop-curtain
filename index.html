
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHOP CURTAIN</title>
<style>
body{font-family:Arial;text-align:center;background:#f1f4f8;padding:25px 15px}
main{max-width:420px;margin:auto;background:white;padding:22px;border-radius:18px}
h1{font-size:30px}
#status{font-size:14px;color:#555}
button{display:block;width:100%;padding:24px;margin:14px 0;border:0;border-radius:12px;color:white;font-size:25px;font-weight:bold}
button:disabled{opacity:.4}
.open{background:#16803c}
.stop{background:#bd2525}
.close{background:#2457c5}
</style>
</head>
<body>
<main>
<h1>SHOP CURTAIN</h1>
<p id="status">Connecting...</p>
<button class="open" data-cmd="open" disabled>OPEN</button>
<button class="stop" data-cmd="stop" disabled>STOP</button>
<button class="close" data-cmd="close" disabled>CLOSE</button>
</main>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const host="l19d3132.ala.asia-southeast1.emqxsl.com";
const username="SHOP_CURTAIN_USER";
const cmdTopic="shop-curtain/command";
const statusTopic="shop-curtain/status";
const status=document.getElementById("status");
const buttons=[...document.querySelectorAll("[data-cmd]")];
let client=null;
let connected=false;

function enable(on){buttons.forEach(b=>b.disabled=!on)}

let password=null;
try{password=localStorage.getItem("shopCurtainPassword")}catch(e){}

if(!password){
  password=prompt("Enter your SHOP CURTAIN MQTT password once on this device:");
  if(password){
    try{localStorage.setItem("shopCurtainPassword",password)}catch(e){}
  }
}

if(password){
  status.textContent="Connecting...";
  client=mqtt.connect("wss://"+host+":8084/mqtt",{
    username:username,
    password:password,
    clientId:"shop-curtain-"+Math.random().toString(16).slice(2,10),
    clean:true,
    connectTimeout:10000,
    reconnectPeriod:3000
  });

  client.on("connect",()=>{
    connected=true;
    enable(true);
    status.textContent="Connected";
    client.subscribe(statusTopic);
  });

  client.on("message",(topic,msg)=>{
    status.textContent="Connected • "+msg.toString();
  });

  client.on("reconnect",()=>{
    connected=false;
    enable(false);
    status.textContent="Reconnecting...";
  });

  client.on("close",()=>{
    connected=false;
    enable(false);
    status.textContent="Disconnected";
  });

  client.on("error",()=>{
    status.textContent="Connection failed. Check internet or MQTT password.";
  });
}else{
  status.textContent="Reload to connect";
}

buttons.forEach(b=>{
  b.addEventListener("click",()=>{
    if(!connected)return;
    client.publish(cmdTopic,b.dataset.cmd,{qos:0,retain:false},err=>{
      status.textContent=err?"Send failed":"Sent "+b.dataset.cmd.toUpperCase();
    });
  });
});
</script>
</body>
</html>
